name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 只读权限即可，CI 不需要写仓库
permissions:
  contents: read

# 同一分支的旧任务自动取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 后端：静态检查 + 单元测试
  # 测试用 Flask 测试客户端，不连真实 MySQL，因此无需任何密钥。
  # ---------------------------------------------------------------------------
  backend:
    name: 后端 · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: ruff check src/server tests

      - name: 单元测试（pytest）
        env:
          # 仅用于让配置解析跑通，不是真实凭据
          MYSQL_PASSWORD: ci-dummy-password
          MYSQL_HOST: 127.0.0.1
          TENCENT_SECRET_ID: ""
          TENCENT_SECRET_KEY: ""
        run: pytest

  # ---------------------------------------------------------------------------
  # 小程序前端：JS 语法 + JSON 校验（零依赖）
  # ---------------------------------------------------------------------------
  miniapp:
    name: 小程序 · 静态检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 语法与 JSON 校验
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 仓库卫生：不允许密钥文件和大文件进版本库
  # ---------------------------------------------------------------------------
  repo-guard:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认没有提交密钥文件
        shell: bash
        run: |
          set -euo pipefail
          banned='(^|/)(\.env|\.env\..+|.*\.pem|.*\.key|.*\.p12|.*\.pfx|.*\.jks|id_rsa.*|id_ed25519.*|credentials\.json|service-account.*\.json)$'
          hits=$(git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -E "$banned" || true)
          if [ -n "$hits" ]; then
            echo "::error::检测到疑似密钥文件被提交："
            echo "$hits"
            exit 1
          fi
          echo "✓ 未发现密钥文件"

      - name: 确认没有大文件（上限 1 MiB）
        shell: bash
        run: |
          set -euo pipefail
          limit=1048576
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::大小 ${size} 字节，超过 1 MiB；请改用 Git LFS 或 Releases 分发"
              fail=1
            fi
          done < <(git ls-files)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "✓ 未发现大文件"
